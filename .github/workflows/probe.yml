name: Probe Google News markup
on:
  push:
    branches:
      - 'claude/**'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i
      - run: node .github/probe/probe.mjs
